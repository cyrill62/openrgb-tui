name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.targets }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, targets: linux-x64 }
          - { os: ubuntu-24.04-arm, targets: linux-arm64 }
          # Built inside rust:alpine (musl host), see the "Build (musl)" step.
          - { os: ubuntu-latest, targets: linux-musl-x64, alpine: true }
          - { os: ubuntu-24.04-arm, targets: linux-musl-arm64, alpine: true }
          - { os: macos-latest, targets: macos }
          - { os: windows-latest, targets: windows-x64 }
          - { os: windows-11-arm, targets: windows-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.alpine }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.alpine }}
        with:
          key: ${{ matrix.targets }}
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows' && !matrix.alpine
        run: bash scripts/build.sh ${{ matrix.targets }}
      # Docker run rather than a job container: JS actions don't run in Alpine on arm64 runners.
      - name: Build (musl)
        if: matrix.alpine
        run: >-
          docker run --rm -v "$PWD:/src" -w /src rust:alpine
          sh -c 'apk add --no-cache bash build-base && bash scripts/build.sh ${{ matrix.targets }}'
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 ${{ matrix.targets }}
      # The release itself is created by scripts/release.sh; this only attaches the archives.
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "${{ github.ref_name }}" dist/*.tar.gz dist/*.zip \
            --clobber --repo "${{ github.repository }}"
